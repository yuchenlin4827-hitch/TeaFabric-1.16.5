// Root build: orchestrates download -> remap -> bake -> TeaVM (Wasm GC) -> web bundle.
// See README.md for the pipeline description.

ext {
    cacheDir = file('.cache')
    setupFile = file('.cache/setup.properties')
    // Reads a value written by :tools:setupMinecraft. Returns null before setup has run.
    setupValue = { String key ->
        if (!setupFile.exists()) return null
        def p = new Properties()
        setupFile.withInputStream { p.load(it) }
        return p.getProperty(key)
    }
    // Returns the jar files of a ';'-separated "coords=path" list from setup.properties.
    setupJars = { String key ->
        def v = setupValue(key)
        if (v == null || v.isEmpty()) return []
        return v.split(';').collect { file(it.substring(it.indexOf('=') + 1)) }
    }
}

repositories {
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
    mavenCentral()
}

subprojects {
    repositories {
        // Google's Maven Central mirror first: repo.maven.apache.org rate-limits bursts (HTTP 429).
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Bake: run the real Fabric Loader over the vanilla client and dump post-transformation classes.
// ---------------------------------------------------------------------------------------------
def bakeRun = file('.cache/bake-run')
def bakedJar = file('.cache/baked/baked.jar')
def withFabricApi = (findProperty('withFabricApi') ?: 'false').toBoolean()

tasks.register('prepareBakeMods', Sync) {
    group = 'teafabric'
    description = 'Collects the mods that are baked into the web build.'
    dependsOn ':baker:jar'
    from(project(':baker').tasks.named('jar'))
    if (findProject(':webmod')?.file('src')?.exists()) {
        dependsOn ':webmod:jar'
        from(project(':webmod').tasks.named('jar'))
    }
    if (withFabricApi && setupValue('fabric.api.jar') != null) {
        from(setupJars('fabric.api.modules'))
    }
    // User-supplied Fabric mods (intermediary-mapped release jars) go into ./mods.
    from(fileTree('mods') { include '*.jar' })
    into(new File(bakeRun, 'mods'))
}

tasks.register('bake', JavaExec) {
    group = 'teafabric'
    description = 'Runs Fabric Loader at build time and writes mixin-applied bytecode to .cache/baked/baked.jar.'
    dependsOn 'prepareBakeMods'
    inputs.dir(new File(bakeRun, 'mods'))
    inputs.file(setupFile)
    outputs.file(bakedJar)
    workingDir = bakeRun
    classpath = files(setupJars('fabric.classpath')) +
            files(setupJars('minecraft.libraries')) +
            files(setupValue('minecraft.clientJar') ?: [])
    mainClass = setupValue('fabric.mainClass') ?: 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    maxHeapSize = '3g'
    systemProperty 'teafabric.bake.output', bakedJar.absolutePath
    systemProperty 'fabric.gameVersion', setupValue('minecraft.version') ?: '1.16.5'
    args '--gameDir', bakeRun.absolutePath, '--version', setupValue('minecraft.version') ?: '1.16.5',
         '--accessToken', '0'
    doFirst { bakedJar.parentFile.mkdirs() }
}

// ---------------------------------------------------------------------------------------------
// TeaVM: compile baked Minecraft + Fabric + platform layer to WebAssembly GC (or JS fallback).
// ---------------------------------------------------------------------------------------------
def teavmTarget = findProperty('teavmTarget') ?: 'wasm-gc'
def teavmOut = file("build/teavm/${teavmTarget}")

def stubsJar = file('.cache/stubs/stubs.jar')

// Program class path for TeaVM, in priority order (first entry wins for duplicate classes).
def programClasspath = {
    def platform = project(':platform')
    def cp = []
    cp += project(':compiler').sourceSets.runtime.output.files // patched TeaVM runtime classes
    cp += platform.sourceSets.main.output.files
    cp += platform.sourceSets.legacy.output.files
    cp += platform.configurations.teavmProgram.files
    cp += bakedJar
    cp += setupJars('fabric.classpath').findAll { it.name.startsWith('sponge-mixin') }
    // Native-only or replaced libraries: LWJGL, Log4j and text2speech/OSHI are reimplemented in :platform.
    def replaced = ['lwjgl', 'log4j-api', 'log4j-core', 'jinput', 'jutils', 'java-objc-bridge', 'text2speech',
                    'oshi-core']
    cp += setupJars('minecraft.libraries').findAll { jar -> !replaced.any { jar.name.startsWith(it) } }
    return cp.findAll { it.exists() }
}

def tablesJar = file('.cache/generated/tables.jar')

tasks.register('generateTables', JavaExec) {
    group = 'teafabric'
    description = 'Whole-program reflection replacement tables (generic supertypes of TypeTokens).'
    dependsOn ':tools:classes', ':platform:classes'
    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'teafabric.tools.GenerateTables'
    outputs.file(tablesJar)
    doFirst {
        args "--out=${tablesJar}",
             "--classpath=${programClasspath().collect { it.absolutePath }.join(File.pathSeparator)}"
    }
}

tasks.register('stubWeb', JavaExec) {
    group = 'teafabric'
    description = 'Generates throwing stubs for browser-impossible APIs reported missing by compileWeb.'
    dependsOn ':tools:classes', ':platform:classes'
    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'teafabric.tools.AutoStub'
    doFirst {
        args "--missing=${teavmOut}/missing.tsv",
             "--state=${file('.cache/stubs/stubs.tsv')}",
             "--out=${stubsJar}",
             "--classpath=${programClasspath().collect { it.absolutePath }.join(File.pathSeparator)}"
    }
}

tasks.register('compileWeb', JavaExec) {
    group = 'teafabric'
    description = 'Compiles the baked game with TeaVM (-PteavmTarget=wasm-gc|js).'
    dependsOn ':platform:classes', ':compiler:classes', 'generateTables'
    classpath = project(':compiler').sourceSets.main.runtimeClasspath
    mainClass = 'teafabric.compiler.Compile'
    maxHeapSize = findProperty('teavmHeap') ?: '6g'
    doFirst {
        def cp = [tablesJar] + programClasspath() // generated tables shadow the baker's copies
        if (stubsJar.exists()) {
            cp += stubsJar // lowest priority: only fills gaps
        }
        args "--target=${teavmTarget}",
             "--main=teafabric.web.WebMain",
             "--out=${teavmOut}",
             "--opt=${findProperty('teavmOpt') ?: 'ADVANCED'}",
             "--fast=${findProperty('teavmFast') ?: 'false'}",
             "--deobfuscation=${findProperty('teavmDeobfuscation') ?: 'true'}",
             // Explicit null/bounds checks: relying on engine traps for NullPointerException
             // crashes current Chromium renderers (reproduced with a 10-line program).
             "--strict=${findProperty('teavmStrict') ?: 'true'}",
             "--obfuscated=${findProperty('teavmObfuscated') ?: 'true'}",
             "--min-heap=${findProperty('teavmMinHeap') ?: '64'}",
             "--max-heap=${findProperty('teavmMaxHeap') ?: '1024'}",
             "--classpath=${cp.collect { it.absolutePath }.join(File.pathSeparator)}"
    }
}

// ---------------------------------------------------------------------------------------------
// Web bundle: build/web = page + Wasm + runtime + resource archives. Contains Minecraft data:
// serve it locally for yourself, do not publish it.
// ---------------------------------------------------------------------------------------------
def webOut = file('build/web')

tasks.register('webClasspathZip', Zip) {
    group = 'teafabric'
    description = 'Non-class resources of the baked jar (vanilla assets/data + mod resources).'
    from(zipTree(bakedJar)) {
        exclude '**/*.class', 'META-INF/**'
    }
    entryCompression = ZipEntryCompression.STORED
    archiveFileName = 'classpath.zip'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = new File(webOut, 'data')
}

tasks.register('webAssetsZip', Zip) {
    group = 'teafabric'
    description = 'Asset index and non-sound objects (sounds are loaded on demand).'
    entryCompression = ZipEntryCompression.STORED
    archiveFileName = 'assets.zip'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = new File(webOut, 'data')
    def indexFile = setupValue('minecraft.assetIndex')
    def assetsDir = setupValue('minecraft.assetsDir')
    if (indexFile != null) {
        def index = new groovy.json.JsonSlurper().parse(new File(indexFile))
        from(new File(indexFile)) { into 'indexes' }
        index.objects.each { name, obj ->
            // -PwebLanguages=all ships every translation; by default only English (in the client jar)
            def langs = (findProperty('webLanguages') ?: '').toString()
            boolean wantLang = !name.startsWith('minecraft/lang/') || langs == 'all'
                    || langs.split(',').any { name == "minecraft/lang/${it}.json" }
            if (!name.endsWith('.ogg') && wantLang && !name.startsWith('minecraft/resourcepacks/')) {
                def h = obj.hash
                def f = new File(assetsDir, "objects/${h.substring(0, 2)}/${h}")
                if (f.exists()) {
                    from(f) { into "objects/${h.substring(0, 2)}" }
                }
            }
        }
    }
}

tasks.register('packageWeb', Copy) {
    group = 'teafabric'
    description = 'Assembles build/web (run: python3 -m http.server -d build/web 8080).'
    dependsOn 'webClasspathZip', 'webAssetsZip'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('web')
    from(teavmOut) {
        include 'classes.wasm', 'classes.wasm.teadbg'
        into 'teavm'
    }
    from({ zipTree(configurations.detachedConfiguration(dependencies.create(
            "org.teavm:teavm-wasm-gc-deobfuscator:${rootProject.property("teavm_version")}")).singleFile) }) {
        include 'org/teavm/backend/wasm/deobfuscator.wasm'
        eachFile { it.path = 'teavm/classes.wasm-deobfuscator.wasm' }
        includeEmptyDirs = false
    }
    from({ zipTree(project(':compiler').configurations.runtimeClasspath.files.find { it.name.startsWith('teavm-core') }) }) {
        include 'org/teavm/backend/wasm/wasm-gc-runtime.js'
        eachFile { it.path = 'teavm/classes.wasm-runtime.js' }
        includeEmptyDirs = false
    }
    into webOut
}

tasks.register('buildWeb') {
    group = 'teafabric'
    description = 'Full pipeline: setup -> bake -> TeaVM Wasm GC -> build/web.'
    dependsOn 'packageWeb'
}
